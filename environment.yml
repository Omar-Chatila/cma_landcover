name: cma_landcover
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pluggy

  - pandas
  - geopandas
  - movingpandas
  - rasterio
  - rioxarray
  - pyproj
  - shapely
  - gdal

  - qt-main
  - pyqt6
  - compilers
  - cmake
  - python-dotenv
  - deprecated

  - pip:
    - "git+https://github.com/Omar-Chatila/cma_environment.git"
